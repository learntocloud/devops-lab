name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v99

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

       - name: Run tests
        working-directory: ./gcp/app
        run: |
          python -m pytest tests/ -v

      - name: Install dependencies
        working-directory: ./gcp/app
        run: |
          pip install -r requirements.txt

      - name: Build Docker image
        run: |
          docker build -f gcp/docker/Dockerfile -t devops-lab-app .
